name: Actualizar avisos

on:
  schedule:
    # Cada 20 min (minutos 7, 27 y 47): GitHub retrasa más los crons que caen en el minuto 0.
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

concurrency:
  group: update-alerts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar avisos de AEMET
        run: python fetcher/fetch_alerts.py --out site/data/alerts.geojson
      - name: Commit si hay cambios
        id: commit
        run: |
          git add site/data/alerts.geojson
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: avisos $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
